<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 480" width="240" height="480" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Settings, VPN and Device Management, Trust (illustration)</title>
<desc id="d">Settings, General, VPN and Device Management: open your Apple Account under Developer App and tap Trust.</desc>
