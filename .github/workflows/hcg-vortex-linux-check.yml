# HCG Vortex — Linux smoke test.
#
# Confirms GitHub Actions can run on this repository at all (the macOS
# build has been cancelled before a runner was assigned), and runs the
# host unit tests for the animation math core. Builds no package and
# publishes nothing.
name: HCG Vortex Linux check

on:
  push:
    paths:
      - "HCGVortex/**"
      - ".github/workflows/hcg-vortex-linux-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: HCGVortex
    steps:
      - uses: actions/checkout@v4

      - name: Runner report
        run: |
          echo "Runner: $RUNNER_OS $RUNNER_ARCH ($ImageOS)"
          cc --version | head -1

      - name: Math core unit tests (ASan/UBSan)
        run: make -C tests test
