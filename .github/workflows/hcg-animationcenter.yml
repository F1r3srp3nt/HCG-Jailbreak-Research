# HCG Animation Center — canonical build on macOS with Xcode (native iOS 14+ arm64e ABI).
#
# Runs the host and iOS Simulator tests, builds and validates the rootless
# package, and uploads it as a workflow artifact. It does NOT publish to HCG
# Repo, sign releases, or deploy to any device. Configuration follows the
# HCG Halo and HCG Vortex build workflows (same runner image, pinned Theos and SDK).
name: HCG Animation Center build

on:
  push:
    paths:
      - "HCGAnimationCenter/**"
      - "!HCGAnimationCenter/distribution/**"
      - "!HCGAnimationCenter/docs/**"
      - "!HCGAnimationCenter/**/*.md"
      - "!HCGAnimationCenter/LICENSE"
      # The Simulator preview harness is not part of the package (its own workflow runs it).
      - "!HCGAnimationCenter/preview/**"
      - "!HCGAnimationCenter/scripts/preview.sh"
      - "!HCGAnimationCenter/scripts/make_sheet.py"
      - ".github/workflows/hcg-animationcenter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        # Explicit bash = bash --noprofile --norc -eo pipefail (a failing command before | tee fails the step).
        shell: bash
        working-directory: HCGAnimationCenter
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install ldid xz dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      # Pinned to the Theos commit HCG Vortex and HCG Halo build with.
      - name: Install Theos (pinned)
        env:
          THEOS_COMMIT: 8167f59de02fd32cf45b16bfcb1330dfa5c9974c
        run: |
          git init -q "$HOME/theos"
          git -C "$HOME/theos" fetch -q --depth 1 https://github.com/theos/theos.git "$THEOS_COMMIT"
          git -C "$HOME/theos" checkout -q FETCH_HEAD
          git -C "$HOME/theos" submodule update -q --init --recursive --depth 1
          [ "$(git -C "$HOME/theos" rev-parse HEAD)" = "$THEOS_COMMIT" ]
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install patched iPhoneOS16.5 SDK (private framework stubs)
        run: scripts/install-sdk.sh

      - name: Toolchain report
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          make --version | head -1
          git -C "$THEOS" log -1 --format='Theos %H %cd'
          git -C "$THEOS" submodule status vendor/dm.pl

      - name: Host unit tests (layout, preset rules, policy; ASan/UBSan)
        run: make -C tests test

      - name: Preset schema, examples and code constants agree
        run: make -C tests schema

      - name: Packaging format regression tests (gzip-only members)
        run: make -C tests deb-format

      - name: Build + validate (requires native new arm64e ABI and a clean commit)
        run: scripts/build.sh 2>&1 | tee "$RUNNER_TEMP/build-validate.log"

      - name: Package listing and checksums
        if: always() && hashFiles('HCGAnimationCenter/packages/*.deb') != ''
        run: |
          DEB=$(ls packages/*.deb)
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB"
          shasum -a 256 "$DEB"
          {
            echo "### HCG Animation Center package"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`$(basename "$DEB")\` |"
            echo "| Size | $(stat -f %z "$DEB") bytes |"
            echo "| SHA-256 | \`$(shasum -a 256 "$DEB" | cut -d' ' -f1)\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo
            echo "Build and package validation only. Not installed on any device by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validated package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hcg-animationcenter-rootless-deb
          path: HCGAnimationCenter/packages/*.deb
          if-no-files-found: error
          retention-days: 90

      # Kept for diagnosis only. Never distribute this artifact.
      - name: Upload UNVALIDATED package (validation failed)
        if: failure() && hashFiles('HCGAnimationCenter/packages/*.deb') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hcg-animationcenter-rootless-deb-UNVALIDATED
          path: HCGAnimationCenter/packages/*.deb
          retention-days: 7

  # Separate job: a slow simulator boot never delays the package build. A
  # failure here still fails the run, and the handoff accepts only runs whose
  # conclusion is success.
  simulator-tests:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: HCGAnimationCenter
    steps:
      - uses: actions/checkout@v4

      - name: Simulator report
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list runtimes

      - name: Runtime tests in the iOS Simulator (preset format, importer, renderer, orientation, placements, packs, AI rules)
        timeout-minutes: 18
        run: scripts/run-simulator-tests.sh

      # The .hcgpack and .hcgbackground the importer / library code exported in
      # the Simulator, for checking with HCG Animation Center for Mac's readers.
      - name: Upload exported preset and pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcg-animationcenter-sim-exports
          path: HCGAnimationCenter/tests/build/sim/exports
          if-no-files-found: warn
          retention-days: 30

      # Best effort and read-only: if this run can read the Mac repository, its
      # own Python validator and Swift reader (hcgpack) check the exported pack.
      # Never fails the run; the step log says whether it ran.
      - name: Check out HCG Animation Center for Mac (read-only, best effort)
        id: mac
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: F1r3srp3nt/animation-centre
          ref: claude/hcg-animation-center-macos-j103uc
          path: mac-animation-centre
          persist-credentials: false

      - name: Mac readers on the exported pack (best effort)
        continue-on-error: true
        working-directory: .
        run: |
          if [ "${{ steps.mac.outcome }}" != success ] || [ ! -d mac-animation-centre ]; then
            echo "HCG Animation Center for Mac is not readable from this run: Mac reader check NOT run here."
            exit 0
          fi
          EXPORTS=HCGAnimationCenter/tests/build/sim/exports
          python3 -m pip install --quiet --break-system-packages 'jsonschema>=4.18' 2>/dev/null || python3 -m pip install --quiet 'jsonschema>=4.18'
          for p in "$EXPORTS"/*.hcgpack; do python3 -I mac-animation-centre/scripts/validate_pack.py "$p"; done
          (cd mac-animation-centre/Packages/HCGAnimationKit && swift build -c release --product hcgpack)
          HCGPACK=mac-animation-centre/Packages/HCGAnimationKit/.build/release/hcgpack
          for p in "$EXPORTS"/*.hcgpack; do "$HCGPACK" validate "$p" && "$HCGPACK" info "$p"; done
