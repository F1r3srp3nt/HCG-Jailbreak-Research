# HCG Animation Center — Linux source checks.
#
# Host unit tests for the pure C core (layout, preset rules, policy), Root.plist
# freshness, the preset schema and the packaging-format regression tests.
# Builds no package and publishes nothing.
name: HCG Animation Center Linux check

on:
  push:
    paths:
      - "HCGAnimationCenter/**"
      - "!HCGAnimationCenter/distribution/**"
      - "!HCGAnimationCenter/docs/**"
      - "!HCGAnimationCenter/**/*.md"
      - ".github/workflows/hcg-animationcenter-linux-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: HCGAnimationCenter
    steps:
      - uses: actions/checkout@v4

      - name: Runner report
        run: |
          echo "Runner: $RUNNER_OS $RUNNER_ARCH ($ImageOS)"
          cc --version | head -1
          clang --version | head -1
          python3 --version

      - name: Core unit tests, GCC (ASan/UBSan)
        run: make -C tests test BUILD=build/gcc CC=gcc

      - name: Core unit tests, Clang (ASan/UBSan)
        run: make -C tests test BUILD=build/clang CC=clang

      - name: Root.plist up to date
        run: python3 -I scripts/generate_root_plist.py --check

      - name: Preset schema, examples and code constants agree
        run: make -C tests schema

      - name: C core 1.0 unchanged (kit 1.1 is additions only; Mac app's vendored copy)
        run: make -C tests compat

      - name: Packaging format regression tests (gzip-only members)
        run: make -C tests deb-format

      - name: Scripts parse
        run: |
          python3 -m py_compile scripts/*.py tests/*.py
          for f in scripts/*.sh; do bash -n "$f"; done
