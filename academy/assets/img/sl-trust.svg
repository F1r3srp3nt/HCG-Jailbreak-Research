<text x="120.0" y="64" font-size="14" fill="#e6edf1" font-weight="700" text-anchor="middle">Device Management</text>
<text x="28" y="64" font-size="11" fill="#2fd3e6" font-weight="400" text-anchor="start">‹ General</text>
<line x1="16" y1="76" x2="224" y2="76" stroke="#2a3a45"/>
<text x="30" y="98" font-size="9.5" fill="#9aa9b2" font-weight="600" text-anchor="start">DEVELOPER APP</text>
