<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 480" width="240" height="480" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Settings, Privacy and Security, Developer Mode (illustration)</title>
<desc id="d">On iOS 16 or later, turn on Developer Mode in Settings, Privacy and Security, then restart when asked.</desc>
<rect width="240" height="480" fill="#0a1116"/>
<rect x="8" y="8" width="224" height="464" rx="30" fill="#05080b" stroke="#2a3a45" stroke-width="2"/>
<rect x="16" y="16" width="208" height="448" rx="24" fill="#10181e"/>
<rect x="86.0" y="22" width="68" height="16" rx="8" fill="#05080b"/>
<text x="120.0" y="64" font-size="14" fill="#e6edf1" font-weight="700" text-anchor="middle">Privacy &amp; Security</text>
<text x="28" y="64" font-size="11" fill="#2fd3e6" font-weight="400" text-anchor="start">‹ Settings</text>
<line x1="16" y1="76" x2="224" y2="76" stroke="#2a3a45"/>
<rect x="26" y="92" width="188" height="34" rx="6" fill="#18232b"/>
<text x="36" y="113" font-size="12" fill="#e6edf1" font-weight="400" text-anchor="start">Location Services</text>
<text x="204" y="113" font-size="11" fill="#9aa9b2" font-weight="600" text-anchor="end">On</text>
<rect x="26" y="132" width="188" height="34" rx="6" fill="#18232b"/>
<text x="36" y="153" font-size="12" fill="#e6edf1" font-weight="400" text-anchor="start">Tracking</text>
<text x="204" y="153" font-size="11" fill="#9aa9b2" font-weight="600" text-anchor="end">›</text>
<text x="30" y="194" font-size="9.5" fill="#9aa9b2" font-weight="600" text-anchor="start">SECURITY</text>
<rect x="26" y="202" width="188" height="34" rx="6" fill="#18232b" stroke="#2fd3e6" stroke-width="2"/>
<text x="36" y="223" font-size="11.5" fill="#e6edf1" font-weight="400" text-anchor="start">Developer Mode</text>
<rect x="164" y="211" width="38" height="17" rx="8.5" fill="#4fcf91"/>
<circle cx="198" cy="219.5" r="7" fill="#fff"/>
<text x="30" y="262" font-size="10" fill="#9aa9b2" font-weight="400" text-anchor="start">iOS restarts and asks you to</text>
<text x="30" y="276" font-size="10" fill="#9aa9b2" font-weight="400" text-anchor="start">confirm after unlocking.</text>
<rect x="76.0" y="430" width="88" height="18" rx="2" fill="none" stroke="#9aa9b2" stroke-dasharray="3 2"/>
<text x="120.0" y="443" font-size="9" fill="#9aa9b2" font-weight="600" text-anchor="middle">ILLUSTRATION</text>
</svg>
