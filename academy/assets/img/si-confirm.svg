<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 480" width="240" height="480" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Sileo queue with Confirm, then Reboot Device (illustration)</title>
<desc id="d">Tap Confirm. When it finishes, tap Reboot Device; this is a userspace reboot and you stay jailbroken.</desc>
<rect width="240" height="480" fill="#0a1116"/>
<rect x="8" y="8" width="224" height="464" rx="30" fill="#05080b" stroke="#2a3a45" stroke-width="2"/>
<rect x="16" y="16" width="208" height="448" rx="24" fill="#10181e"/>
<rect x="86.0" y="22" width="68" height="16" rx="8" fill="#05080b"/>
<text x="120.0" y="64" font-size="14" fill="#e6edf1" font-weight="700" text-anchor="middle">Queue</text>
<line x1="16" y1="76" x2="224" y2="76" stroke="#2a3a45"/>
<text x="30" y="100" font-size="9.5" fill="#9aa9b2" font-weight="600" text-anchor="start">INSTALLATIONS</text>
<rect x="26" y="108" width="188" height="34" rx="6" fill="#18232b"/>
<text x="36" y="129" font-size="12" fill="#e6edf1" font-weight="400" text-anchor="start">ElleKit</text>
<rect x="26" y="146" width="188" height="34" rx="6" fill="#18232b"/>
<text x="36" y="167" font-size="12" fill="#e6edf1" font-weight="400" text-anchor="start">PreferenceLoader</text>
<rect x="30" y="196" width="180" height="48" rx="12" fill="none" stroke="#2fd3e6" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="36" y="200" width="168" height="40" rx="9" fill="#2fd3e6"/>
<text x="120.0" y="225" font-size="14" fill="#031015" font-weight="700" text-anchor="middle">Confirm</text>
<text x="120.0" y="282" font-size="10" fill="#9aa9b2" font-weight="400" text-anchor="middle">When it finishes:</text>
<rect x="30" y="292" width="180" height="48" rx="12" fill="none" stroke="#2fd3e6" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="36" y="296" width="168" height="40" rx="9" fill="#18232b"/>
<text x="120.0" y="321" font-size="14" fill="#2fd3e6" font-weight="700" text-anchor="middle">Reboot Device</text>
<text x="120.0" y="362" font-size="10" fill="#4fcf91" font-weight="600" text-anchor="middle">Stays jailbroken afterwards</text>
<rect x="76.0" y="430" width="88" height="18" rx="2" fill="none" stroke="#9aa9b2" stroke-dasharray="3 2"/>
<text x="120.0" y="443" font-size="9" fill="#9aa9b2" font-weight="600" text-anchor="middle">ILLUSTRATION</text>
</svg>
