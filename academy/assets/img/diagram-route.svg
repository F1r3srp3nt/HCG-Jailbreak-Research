<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Which installation route applies</title>
<desc id="d">Versions 15.0 to 16.6.1, 16.7 RC and 17.0 use TrollStore. 16.7 to 16.7.x and 17.0.1 to 17.3.1 use sideloading on all supported chips; 17.4 to 18.7.1 and 26.0 to 26.0.1 use sideloading on A13 and earlier only. Anything else is not supported.</desc>
<rect width="760" height="360" fill="#0a1116"/>
<text x="30" y="34" font-size="12" fill="#9aa9b2" font-weight="600" text-anchor="start">iOS / iPadOS version</text>
<text x="270" y="34" font-size="12" fill="#9aa9b2" font-weight="600" text-anchor="start">Route</text>
<text x="430" y="34" font-size="12" fill="#9aa9b2" font-weight="600" text-anchor="start">What it means</text>
<rect x="24" y="48" width="712" height="38" rx="6" fill="#10181e" stroke="#2a3a45"/>
<rect x="24" y="48" width="5" height="38" fill="#4fcf91"/>
<text x="40" y="72" font-size="13" fill="#e6edf1" font-weight="700" text-anchor="start">15.0 – 16.6.1</text>
<text x="270" y="72" font-size="13" fill="#4fcf91" font-weight="700" text-anchor="start">TrollStore route</text>
<text x="430" y="72" font-size="11.5" fill="#e6edf1" font-weight="400" text-anchor="start">TrollStore installs Dopamine permanently (no 7-day expiry)</text>
<rect x="24" y="94" width="712" height="38" rx="6" fill="#10181e" stroke="#2a3a45"/>
<rect x="24" y="94" width="5" height="38" fill="#4fcf91"/>
<text x="40" y="118" font-size="13" fill="#e6edf1" font-weight="700" text-anchor="start">16.7 RC (20H18), 17.0</text>
<text x="270" y="118" font-size="13" fill="#4fcf91" font-weight="700" text-anchor="start">TrollStore route</text>
<text x="430" y="118" font-size="11.5" fill="#e6edf1" font-weight="400" text-anchor="start">TrollStore via TrollRestore (needs a computer)</text>
<rect x="24" y="140" width="712" height="38" rx="6" fill="#10181e" stroke="#2a3a45"/>
<rect x="24" y="140" width="5" height="38" fill="#e7b866"/>
<text x="40" y="164" font-size="13" fill="#e6edf1" font-weight="700" text-anchor="start">16.7 – 16.7.x, 17.0.1 – 17.3.1</text>
<text x="270" y="164" font-size="13" fill="#e7b866" font-weight="700" text-anchor="start">Sideload route</text>
<text x="430" y="164" font-size="11.5" fill="#e6edf1" font-weight="400" text-anchor="start">all supported chips; re-sign every 7 days</text>
<rect x="24" y="186" width="712" height="38" rx="6" fill="#10181e" stroke="#2a3a45"/>
<rect x="24" y="186" width="5" height="38" fill="#e7b866"/>
<text x="40" y="210" font-size="13" fill="#e6edf1" font-weight="700" text-anchor="start">17.4 – 18.7.1</text>
<text x="270" y="210" font-size="13" fill="#e7b866" font-weight="700" text-anchor="start">Sideload route</text>
<text x="430" y="210" font-size="11.5" fill="#e6edf1" font-weight="400" text-anchor="start">A13 and earlier only; re-sign every 7 days</text>
<rect x="24" y="232" width="712" height="38" rx="6" fill="#10181e" stroke="#2a3a45"/>
<rect x="24" y="232" width="5" height="38" fill="#e7b866"/>
<text x="40" y="256" font-size="13" fill="#e6edf1" font-weight="700" text-anchor="start">26.0 – 26.0.1</text>
<text x="270" y="256" font-size="13" fill="#e7b866" font-weight="700" text-anchor="start">Sideload route</text>
<text x="430" y="256" font-size="11.5" fill="#e6edf1" font-weight="400" text-anchor="start">A13 and earlier only; re-sign every 7 days</text>
<rect x="24" y="278" width="712" height="38" rx="6" fill="#10181e" stroke="#2a3a45"/>
<rect x="24" y="278" width="5" height="38" fill="#ff8a80"/>
<text x="40" y="302" font-size="13" fill="#e6edf1" font-weight="700" text-anchor="start">anything else</text>
<text x="270" y="302" font-size="13" fill="#ff8a80" font-weight="700" text-anchor="start">Not supported</text>
<text x="430" y="302" font-size="11.5" fill="#e6edf1" font-weight="400" text-anchor="start">no Dopamine release covers it (as of 21 Nov 2026)</text>
<text x="30" y="336" font-size="12" fill="#9aa9b2" font-weight="400" text-anchor="start">From ios.cfw.guide (Installing Dopamine / Installing Dopamine (TrollStore)). Use the checker for your exact model.</text>
<text x="30" y="352" font-size="11" fill="#9aa9b2" font-weight="400" text-anchor="start">Original HCG diagram.</text>
</svg>
