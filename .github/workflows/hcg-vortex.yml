# HCG Vortex — canonical build on macOS with Xcode (native iOS 14+ arm64e ABI).
#
# Builds and validates the rootless package and uploads it as a workflow
# artifact. It does NOT publish to the HCG Repo, sign releases, or deploy to
# any device.
name: HCG Vortex build

on:
  push:
    paths:
      - "HCGVortex/**"
      - ".github/workflows/hcg-vortex.yml"
  # No pull_request trigger: this repo's PRs come from same-repo branches,
  # whose push runs already attach to the PR. Both triggers together ran the
  # macOS build twice per commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # macos-14 was rejected by GitHub: "The configuration 'macos-14-arm64-us-default' is not supported"
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: HCGVortex
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install ldid xz dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      # Pinned to the Theos commit that built 0.1.0~beta1 (run 43970942708 logged
      # "Theos 8167f59"), so the packager (vendor/dm.pl) and its compression
      # settings are the ones the Makefile was written against.
      - name: Install Theos (pinned)
        env:
          THEOS_COMMIT: 8167f59de02fd32cf45b16bfcb1330dfa5c9974c
        run: |
          git init -q "$HOME/theos"
          git -C "$HOME/theos" fetch -q --depth 1 https://github.com/theos/theos.git "$THEOS_COMMIT"
          git -C "$HOME/theos" checkout -q FETCH_HEAD
          git -C "$HOME/theos" submodule update -q --init --recursive --depth 1
          [ "$(git -C "$HOME/theos" rev-parse HEAD)" = "$THEOS_COMMIT" ]
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install patched iPhoneOS16.5 SDK (private framework stubs)
        run: scripts/install-sdk.sh

      - name: Toolchain report
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          make --version | head -1
          git -C "$THEOS" log -1 --format='Theos %H %cd'
          git -C "$THEOS" submodule status vendor/dm.pl

      - name: Compatibility gate tests (Apple Objective-C runtime)
        run: make -C tests compat

      - name: Packaging format regression tests (gzip-only members)
        run: make -C tests deb-format

      - name: Build + validate (requires native new arm64e ABI)
        run: scripts/build.sh

      - name: Package listing
        if: always() && hashFiles('HCGVortex/packages/*.deb') != ''
        run: |
          DEB=$(ls packages/*.deb)
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB"
          shasum -a 256 "$DEB"

      - name: Upload validated package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hcg-vortex-rootless-deb
          path: HCGVortex/packages/*.deb
          if-no-files-found: error
          # Long enough for device testing and the HCG-repo import, after which
          # the .deb lives in HCG-repo's pool with provenance.
          retention-days: 90

      # Kept for diagnosis only. Never distribute this artifact.
      - name: Upload UNVALIDATED package (validation failed)
        if: failure() && hashFiles('HCGVortex/packages/*.deb') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hcg-vortex-rootless-deb-UNVALIDATED
          path: HCGVortex/packages/*.deb
          retention-days: 7
