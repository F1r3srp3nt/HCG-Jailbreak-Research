# HCG Animation Center — PREVIEW and coexistence run in the iOS Simulator.
#
# Runs the real tweak code and the real Settings bundle in a stand-in
# SpringBoard, together with HCG Halo's real controller (this repository,
# branch claude/hcg-halo-tweak-tfnxxl), HCG Vortex's real engine (branch
# claude/vortex-polish) and HCG Nexus's real panel (F1r3srp3nt/HCG-Nexus,
# public). Records video and screenshots. Preview evidence, NOT a device result.
# Publishes nothing.
name: HCG Animation Center preview

on:
  push:
    paths:
      - "HCGAnimationCenter/**"
      - "!HCGAnimationCenter/distribution/**"
      - "!HCGAnimationCenter/docs/**"
      - "!HCGAnimationCenter/**/*.md"
      - ".github/workflows/hcg-animationcenter-preview.yml"
  workflow_dispatch:
    inputs:
      halo_ref:
        description: "HCG Halo branch in this repository"
        default: "claude/hcg-halo-tweak-tfnxxl"
      vortex_ref:
        description: "HCG Vortex branch in this repository"
        default: "claude/vortex-polish"
      nexus_ref:
        description: "HCG-Nexus branch, tag or commit"
        default: "claude/nexus-combined-0.3.1"

permissions:
  contents: read

jobs:
  preview:
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: HCGAnimationCenter
    env:
      HALO_REF: ${{ inputs.halo_ref || 'claude/hcg-halo-tweak-tfnxxl' }}
      VORTEX_REF: ${{ inputs.vortex_ref || 'claude/vortex-polish' }}
      NEXUS_REF: ${{ inputs.nexus_ref || 'claude/nexus-combined-0.3.1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch HCG Halo, HCG Vortex (this repository) and HCG Nexus (public), read-only
        run: |
          for pair in "halo:$HALO_REF" "vortex:$VORTEX_REF"; do
            name=${pair%%:*}; ref=${pair#*:}
            git init -q "$RUNNER_TEMP/$name"
            git -C "$RUNNER_TEMP/$name" fetch -q --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$ref"
            git -C "$RUNNER_TEMP/$name" checkout -q FETCH_HEAD
            echo "$name $ref = $(git -C "$RUNNER_TEMP/$name" rev-parse HEAD)"
          done
          git init -q "$RUNNER_TEMP/nexus"
          git -C "$RUNNER_TEMP/nexus" fetch -q --depth 1 https://github.com/F1r3srp3nt/HCG-Nexus.git "$NEXUS_REF"
          git -C "$RUNNER_TEMP/nexus" checkout -q FETCH_HEAD
          echo "nexus $NEXUS_REF = $(git -C "$RUNNER_TEMP/nexus" rev-parse HEAD)"
          echo "HALO_DIR=$RUNNER_TEMP/halo/HCGHalo" >> "$GITHUB_ENV"
          echo "VORTEX_DIR=$RUNNER_TEMP/vortex/HCGVortex" >> "$GITHUB_ENV"
          echo "NEXUS_DIR=$RUNNER_TEMP/nexus" >> "$GITHUB_ENV"

      - name: Install Theos (pinned; Preferences headers only)
        env:
          THEOS_COMMIT: 8167f59de02fd32cf45b16bfcb1330dfa5c9974c
        run: |
          git init -q "$HOME/theos"
          git -C "$HOME/theos" fetch -q --depth 1 https://github.com/theos/theos.git "$THEOS_COMMIT"
          git -C "$HOME/theos" checkout -q FETCH_HEAD
          git -C "$HOME/theos" submodule update -q --init --recursive --depth 1
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Pillow (contact sheet)
        run: python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow

      - name: Simulator report
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Build and run the preview, recording video and screenshots
        timeout-minutes: 25
        run: |
          echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          scripts/preview.sh "$RUNNER_TEMP/hac-preview"

      - name: Upload preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcg-animationcenter-preview
          path: ${{ runner.temp }}/hac-preview/
          if-no-files-found: warn
          retention-days: 90
