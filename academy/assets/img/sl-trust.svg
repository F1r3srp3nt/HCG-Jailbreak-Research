<text x="36" y="127" font-size="12" fill="#e6edf1" font-weight="400" text-anchor="start">Apple Development: you@…</text>
<text x="204" y="127" font-size="11" fill="#9aa9b2" font-weight="600" text-anchor="end">›</text>
<text x="30" y="172" font-size="10" fill="#9aa9b2" font-weight="400" text-anchor="start">Apps from developer “you@…”</text>
<text x="30" y="186" font-size="10" fill="#9aa9b2" font-weight="400" text-anchor="start">are not trusted on this iPhone.</text>
